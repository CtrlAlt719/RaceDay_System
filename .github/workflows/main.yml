name: .NET Core Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore RaceDay_System.sln

    - name: Build Project
      run: dotnet build RaceDay_System.sln --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test RaceDay_System.sln --no-build --verbosity normal --configuration Release
